<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Relative Pitch Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- Start Screen -->
    <div id="start-screen">
      <h1>Choose Your Game</h1>
      <button id="one-octave-btn" class="green-button">One Octave (C4–C5)</button>
      <button id="two-octave-btn" class="green-button">Two Octave (C3–C5)</button>
      <button id="three-octave-btn" class="green-button">Three Octave (C3–C6)</button>
    </div>

    <!-- Game Screens -->
    <!-- One Octave Game -->
    <div id="one-octave-game" class="hidden">
      <button id="back-btn" class="green-button">Back</button>
      <!-- Game content here -->
    </div>

    <!-- Two Octave Game -->
    <div id="two-octave-game" class="hidden">
      <button id="back-btn-2" class="green-button">Back</button>
      <!-- Game content here -->
    </div>

    <!-- Three Octave Game -->
    <div id="three-octave-game" class="hidden">
      <button id="back-btn-3" class="green-button">Back</button>
      <!-- Game content here -->
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
